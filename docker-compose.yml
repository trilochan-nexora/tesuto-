services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesuto
      POSTGRES_PASSWORD: tesuto
      POSTGRES_DB: tesuto
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesuto -d tesuto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
